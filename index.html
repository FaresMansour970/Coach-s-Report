<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقرير اليومي للمدرب | Tech Box</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f40;--gold:#c9a227;--gray:#8e8f94;--bg:#f3f4f7;--card:#fff;--text:#1b2233;--line:#d9dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--text:#e8ebf3;--line:#2c3856;--navy:#e8c35a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',Tahoma,Arial,sans-serif;line-height:1.6}
header{background:#0b1f40;color:#fff;padding:18px 16px;border-bottom:4px solid var(--gold);text-align:center}
.logo{font-size:30px;font-weight:700;letter-spacing:1px}.logo b{color:var(--gold)}
header p{margin:2px 0 0;color:#c7cbd6}
main{max-width:860px;margin:20px auto;padding:0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px;color:var(--navy);border-inline-start:4px solid var(--gold);padding-inline-start:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--text)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#0b1f40;color:#fff}
button.gold{background:var(--gold);color:#0b1f40}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.saved{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.saved:last-child{border:0}.saved span{flex:1}.saved button{padding:5px 10px;font-size:13px}
#msg{color:var(--gold);font-weight:700;min-height:24px}
.att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:14px}.chip button{padding:2px 8px;font-size:12px;border-radius:12px;color:#fff}.chip.p button:not(.x){background:#2e7d4f}.chip.a button:not(.x){background:#b3392f}.chip .x{background:transparent;color:var(--text);padding:0 4px;font-size:16px}
@media print{.chip .x,.addrow{display:none}header~main .actions,#savedBox,#msg{display:none}body{background:#fff;color:#000}section{break-inside:avoid}input,select,textarea{border:1px solid #bbb;background:#fff;color:#000}}
#pd{display:none;font-family:'Tajawal',Tahoma,Arial,sans-serif;color:#1b2233;font-size:11pt;line-height:1.6;padding-bottom:14mm}
#pd .lh{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c9a227;padding-bottom:8px;margin-bottom:10px}
#pd .lg{font-size:28pt;font-weight:700;color:#0b1f40;line-height:1.1}#pd .lg b{color:#c9a227}#pd .lg small{display:block;font-size:9pt;color:#8e8f94;font-weight:400}
#pd .tt{text-align:left;direction:ltr}#pd .tt h1{margin:0;font-size:17pt;color:#0b1f40}#pd .tt div{font-size:9.5pt;color:#555}
#pd h3{background:#0b1f40;color:#fff;padding:3px 10px;font-size:11pt;margin:12px 0 6px;border-inline-start:5px solid #c9a227;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pd table{width:100%;border-collapse:collapse}#pd tr{break-inside:avoid}
#pd th,#pd td{border:1px solid #b9bdc7;padding:3px 8px;text-align:right;font-size:10pt}
#pd th{background:#eef0f5;color:#0b1f40;width:16%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pd .stats{display:flex;gap:8px;margin-bottom:8px}#pd .st{flex:1;border:1px solid #b9bdc7;text-align:center;padding:4px;font-size:9.5pt}#pd .st b{display:block;font-size:15pt;color:#0b1f40}
#pd .tx{border:1px solid #b9bdc7;padding:5px 10px;min-height:30px;white-space:pre-wrap;break-inside:avoid}
#pd .sg{display:flex;gap:10px;margin-top:16px;break-inside:avoid}#pd .sg div{flex:1;border:1px solid #b9bdc7;padding:6px;height:105px;text-align:center;font-size:10pt}
#pd .sg b{display:block;background:#eef0f5;color:#0b1f40;margin:-6px -6px 6px;padding:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pd .ft{position:fixed;bottom:0;left:0;right:0;border-top:1px solid #0b1f40;font-size:8.5pt;color:#555;display:flex;justify-content:space-between;padding-top:3px;background:#fff}
@media print{@page{size:A4;margin:12mm}html,body{background:#fff!important;color:#000}header,main{display:none!important}#pd{display:block}}
</style>
</head>
<body>
<header><div class="logo"><img id="hl" alt="Tech Box" style="height:96px;background:#fff;border-radius:14px;padding:6px"></div><p>نموذج التقرير اليومي للمدرب</p></header>
<main>
<div class="actions">
<button class="gold" onclick="save()">💾 حفظ التقرير</button>
<button onclick="printReport()">🖨️ طباعة / PDF</button>
<button onclick="copyText()">📋 نسخ كنص</button>
<button class="ghost" onclick="clearForm()">تفريغ النموذج</button>
</div>
<div id="msg"></div>
<form id="f" onsubmit="return false">
<section><h2>بيانات المدرب والدورة</h2><div class="grid">
<div><label>اسم المدرب</label><input name="trainer"></div>
<div><label>اسم الدورة / البرنامج</label><input name="course"></div>
<div><label>تاريخ التقرير</label><input type="date" name="date"></div>
<div><label>رقم اليوم التدريبي</label><input type="number" min="1" name="day"></div>
<div><label>مكان / نمط التدريب</label><select name="mode"><option>حضوري</option><option>عن بُعد</option><option>مدمج</option></select></div>
<div><label>القاعة / المنصة</label><input name="venue"></div>
<div><label>وقت البدء</label><input type="time" name="start"></div>
<div><label>وقت الانتهاء</label><input type="time" name="end"></div>
</div></section>
<section><h2>الحضور</h2><div class="grid">
<div><label>عدد المسجلين</label><input type="number" min="0" name="reg"></div>
<div><label>عدد الحاضرين</label><input type="number" min="0" name="pres"></div>
<div><label>عدد الغائبين</label><input type="number" min="0" name="abs"></div>
<div class="full"><label>أسماء المتدربين</label><div class="addrow" style="display:flex;gap:8px"><input id="newName" placeholder="اكتب اسم المتدرب ثم Enter (أو عدة أسماء مفصولة بفاصلة)"><button type="button" onclick="addAtt()">إضافة</button></div><div id="attList"></div><small style="color:var(--gray)">اضغط على (حاضر/غائب) لتبديل الحالة، وتُحسب الأعداد تلقائياً.</small></div>
<div class="full"><label>ملاحظات على الحضور (تأخر، انسحاب...)</label><input name="attnote"></div>
</div></section>
<section><h2>المحتوى المنفَّذ</h2><div class="grid">
<div class="full"><label>المحاور / الموضوعات التي تم تقديمها</label><textarea name="topics"></textarea></div>
<div class="full"><label>الأنشطة والتطبيقات العملية</label><textarea name="acts"></textarea></div>
<div><label>مدى تحقيق أهداف اليوم</label><select name="goals"><option>تحققت بالكامل</option><option>تحققت بدرجة كبيرة</option><option>تحققت جزئياً</option><option>لم تتحقق</option></select></div>
<div><label>تفاعل المتدربين</label><select name="engage"><option>ممتاز</option><option>جيد جداً</option><option>جيد</option><option>ضعيف</option></select></div>
</div></section>
<section><h2>التقييم والملاحظات</h2><div class="grid">
<div class="full"><label>التحديات والصعوبات</label><textarea name="issues"></textarea></div>
<div class="full"><label>ملاحظات المتدربين / تغذية راجعة</label><textarea name="feedback"></textarea></div>
<div class="full"><label>احتياجات من إدارة البرامج (أجهزة، مواد، دعم...)</label><textarea name="needs"></textarea></div>
<div class="full"><label>خطة اليوم التالي</label><textarea name="next"></textarea></div>
<div class="full"><label>التوصيات</label><textarea name="recs"></textarea></div>
<div><label>توقيع المدرب</label><input name="sign"></div>
</div></section>
</form>
<section id="savedBox"><h2>التقارير المحفوظة (على هذا الجهاز)</h2><div id="list"></div></section>
</main>

const KEY='techbox_reports',f=document.getElementById('f');let att=[];
const L={trainer:'المدرب',course:'الدورة',date:'التاريخ',day:'اليوم التدريبي',mode:'النمط',venue:'المكان',start:'البدء',end:'الانتهاء',reg:'المسجلون',pres:'الحاضرون',abs:'الغائبون',attnote:'ملاحظات الحضور',topics:'المحاور',acts:'الأنشطة',goals:'تحقق الأهداف',engage:'التفاعل',issues:'التحديات',feedback:'تغذية المتدربين',needs:'الاحتياجات',next:'خطة الغد',recs:'التوصيات',sign:'التوقيع'};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function store(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){msg('تعذر الحفظ على هذا المتصفح')}}
function msg(t){const m=document.getElementById('msg');m.textContent=t;setTimeout(()=>m.textContent='',3000)}
function data(){const d={};new FormData(f).forEach((v,k)=>d[k]=v);d.att=att.map(x=>({n:x.n,p:x.p}));return d}
function save(){const d=data();if(!d.trainer||!d.date){msg('يرجى إدخال اسم المدرب والتاريخ');return}
d.id=d.id||Date.now();const a=load();a.unshift(d);store(a);render();msg('تم حفظ التقرير ✓')}
function copyText(){const d=data();const t='تقرير يومي - Tech Box\n'+Object.keys(L).map(k=>L[k]+': '+(d[k]||'-')).join('\n')+'\nأسماء المتدربين:\n'+att.map((x,i)=>(i+1)+'. '+x.n+' ('+(x.p?'حاضر':'غائب')+')').join('\n');
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>msg('تم النسخ ✓')).catch(()=>msg('تعذر النسخ'))}
function clearForm(){f.reset();att=[];renderAtt();f.date.valueAsDate=new Date()}
function openR(i){const d=load()[i];Object.keys(d).forEach(k=>{if(f[k])f[k].value=d[k]});att=(d.att||[]).map(x=>({n:x.n,p:x.p}));renderAtt();scrollTo(0,0)}
function delR(i){const a=load();a.splice(i,1);store(a);render()}
function render(){const a=load(),el=document.getElementById('list');
el.innerHTML=a.length?'':'<p style="color:var(--gray)">لا توجد تقارير محفوظة بعد.</p>';
a.forEach((d,i)=>{const r=document.createElement('div');r.className='saved';
const s=document.createElement('span');s.textContent=d.date+' — '+d.trainer+' — '+(d.course||'');
const o=document.createElement('button');o.className='ghost';o.textContent='فتح';o.onclick=()=>openR(i);
const x=document.createElement('button');x.className='ghost';x.textContent='حذف';x.onclick=()=>delR(i);
r.append(s,o,x);el.append(r)})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function printReport(){const d=data();let ds=d.date||'';

const r4=(a,ka,b,kb)=>'<tr><th>'+a+'</th><td>'+v(ka)+'</td><th>'+b+'</th><td>'+v(kb)+'</td></tr>';

const h=Math.ceil(att.length/2),cell=(i)=>att[i]?'<td>'+(i+1)+'</td><td>'+esc(att[i].n)+'</td><td>'+(att[i].p?'حاضر':'غائب')+'</td>':'<td></td><td></td><td></td>';
for(let i=0;i<h;i++)names+='<tr>'+cell(i)+cell(i+h)+'</tr>';names+='</table>'}

function renderAtt(){const el=document.getElementById('attList');el.innerHTML='';el.className='att';
att.forEach((x,i)=>{const c=document.createElement('span');c.className='chip '+(x.p?'p':'a');
const n=document.createElement('span');n.textContent=(i+1)+'. '+x.n;
const t=document.createElement('button');t.type='button';t.textContent=x.p?'حاضر':'غائب';t.onclick=()=>{x.p=!x.p;renderAtt()};
const d=document.createElement('button');d.type='button';d.className='x';d.textContent='×';d.onclick=()=>{att.splice(i,1);renderAtt()};
c.append(n,t,d);el.append(c)});
if(att.length){const p=att.filter(x=>x.p).length;f.reg.value=att.length;f.pres.value=p;f.abs.value=att.length-p}}
function addAtt(){const inp=document.getElementById('newName');inp.value.split(/[,،\n]/).map(s=>s.trim()).filter(Boolean).forEach(n=>att.push({n,p:true}));inp.value='';renderAtt();inp.focus()}
document.getElementById('newName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addAtt()}});
clearForm();render();
